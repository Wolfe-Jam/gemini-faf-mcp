name: 📡 MCP Registry Publish (DNS)

# Keeps the MCP Registry (and downstream directories like Glama) in lock-step
# with the repo: every published GitHub Release pushes the current server.json
# to registry.modelcontextprotocol.io. No human, no hand-cranked mcp-publisher,
# no drift.
#
# Auth = DNS. GitHub OIDC only authorises the io.github.<owner>/* namespace;
# DNS auth proves ownership of faf.one → authorises the one.faf/* namespace.
# Requires repo secret FAF_ONE_MCP_PRIVATE_KEY = the ed25519 private key (64-hex)
# whose public key is the `v=MCPv1; k=ed25519; p=...` TXT record at the faf.one apex.

on:
  release:
    types: [published]      # each release = a new server.json version → publish it
  workflow_dispatch: {}      # manual re-publish if ever needed

permissions:
  contents: read

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: v1.8.6
  # sha256 of mcp-publisher_linux_amd64.tar.gz at v1.8.6 (registry_1.8.6_checksums.txt)
  MCP_PUBLISHER_SHA256: 1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          set -euo pipefail
          # Asset name carries NO version: mcp-publisher_<os>_<arch>.tar.gz
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Validate server.json
        run: ./mcp-publisher validate

      # GATE: server.json must match the release tag (release events only) so a
      # stale server.json can't publish the OLD version under a new release tag.
      - name: Verify server.json version matches release tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(jq -r .version server.json)
          if [ "$MANIFEST_VERSION" != "$TAG" ]; then
            echo "::error::server.json version ($MANIFEST_VERSION) does not match release tag ($TAG). Bump server.json before tagging."
            exit 1
          fi
          echo "✓ server.json v$MANIFEST_VERSION matches release tag v$TAG"

      - name: Wait for PyPI to resolve this version
        # pypi.yml and publish-mcp-registry.yml both fire off the same
        # release:published event with no ordering guarantee between parallel
        # jobs. mcp-publisher's publish call validates the declared pypi package
        # against the live index, so a still-propagating PyPI publish reads as a
        # 400 here (same failure class hit live on rust-faf-mcp 0.4.3, 2026-08-20 —
        # see rust-faf-mcp's publish-mcp-registry.yml for the reference gate).
        # Uses the version-pinned endpoint (pypi.org/pypi/<pkg>/<ver>/json) —
        # never the general /pypi/<pkg>/json, which Fastly-lags minutes after
        # publish and would falsely report "not live yet" long after it is.
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          PKG=$(jq -r '.packages[] | select(.registryType=="pypi") | .identifier' server.json)
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Waiting for PyPI ${PKG}==${VERSION} to be live..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/${PKG}/${VERSION}/json")
            if [ "$code" = "200" ]; then echo "✅ PyPI confirms ${PKG}==${VERSION} live."; exit 0; fi
            echo "  attempt ${i}/30 — pypi HTTP ${code}, retrying in 10s..."
            sleep 10
          done
          echo "::error::Timed out after 5m waiting for PyPI to publish ${PKG}==${VERSION}."
          exit 1

      - name: Check if this version is already published (idempotent)
        id: ver
        run: |
          NAME=$(jq -r .name server.json)
          LOCAL=$(jq -r .version server.json)
          PUBLISHED=$(curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=${NAME}&version=latest" \
            | jq -r --arg n "$NAME" '[.servers[].server | select(.name==$n) | .version] | first // ""')
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "✓ ${NAME} v${LOCAL} is already the registry's latest — nothing to do."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "${NAME} v${LOCAL} not yet published (registry latest: ${PUBLISHED:-none}) — will publish."
          fi

      - name: Authenticate (DNS — one.faf namespace)
        if: steps.ver.outputs.publish == 'true'
        env:
          MCP_PRIVATE_KEY: ${{ secrets.FAF_ONE_MCP_PRIVATE_KEY }}
        run: node .github/scripts/registry-login.mjs --domain faf.one   # the key from the environment, never argv

      - name: Publish to MCP Registry
        if: steps.ver.outputs.publish == 'true'
        run: |
          ./mcp-publisher publish
          echo "Published $(jq -r .version server.json) to the MCP Registry (one.faf/*). Glama re-syncs on its next crawl."
