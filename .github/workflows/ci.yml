name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest + lint + types
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy server.py models.py safe_path.py inject.py src/

      - name: Pytest
        run: pytest -q --junitxml=junit.xml

      # The receipt reads one leg's JUnit report: Python 3.13, the newest.
      - name: Upload test report for the TAF receipt
        if: ${{ !cancelled() && matrix.python-version == '3.13' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: taf-test-output
          path: junit.xml
          overwrite: true

  # TAF receipt: one per push to main, red runs included (FAILED), saved to the
  # taf-receipts branch by taf-git's receipt job, the only job that writes.
  # test-result is the whole matrix: a red leg on any Python records FAILED.
  receipt:
    needs: test
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    uses: Wolfe-Jam/taf-git/.github/workflows/receipt.yml@v3.0.0
    with:
      artifact-name: taf-test-output
      test-output-file: junit.xml
      test-result: ${{ needs.test.result }}

  faf:
    name: project.faf still Trophy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: faf-cli check --strict
        run: npx -y faf-cli@8.0.0 check project.faf --strict
