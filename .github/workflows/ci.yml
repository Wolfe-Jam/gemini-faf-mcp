name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest + lint + types
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy server.py models.py safe_path.py inject.py src/

      - name: Pytest
        run: pytest -q

  faf:
    name: project.faf still Trophy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: faf-cli check --strict
        run: npx -y faf-cli@7.10.1 check project.faf --strict
