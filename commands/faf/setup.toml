description = "Set up FAF project DNA — create or score your .faf file"

prompt = """
Set up FAF project DNA in the current directory. Use FAF MCP tools only.

## What to do

Run `faf_discover` (no arguments) to check for a project.faf first.

**If it finds `project.faf` in the current directory** (`found: true`, and the returned `path` is `project.faf` directly inside `searched_from`): run `faf_score` on it and show the result.
```
Found: project.faf
Score: {score}% ({tier})
```
If score < 85%, run `faf_validate` and list the errors and warnings.

**Otherwise** (`found: false`, or the file it found is in a parent directory): run `faf_init` with `path` set to `project.faf`, then `faf_score`, and show the result.
```
Created: project.faf
Score: {score}% ({tier})

Edit project.faf to improve your score.
```
If `faf_init` returns an error, show its `error` text and stop.

An older `.faf` file (not `project.faf`) in this directory doesn't count: create `project.faf` beside it, which is the file `/faf:score` and `/faf:export` look for.

## Rules

- Run faf_discover first, then faf_init only when this directory has no project.faf. faf_init never overwrites, and a refusal is reported as an error.
- faf_discover is the only lookup. Do not search for .faf files any other way. Do not explore the filesystem.
- Do not ask the user questions. Just do it.
- Use FAF MCP tools only (faf_discover, faf_init, faf_score, faf_validate). Never built-in file tools.
"""
