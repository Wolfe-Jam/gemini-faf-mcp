[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-faf-mcp"
version = "2.6.0"
authors = [
  { name="wolfejam", email="james@wolfejam.dev" },
]
description = "Persistent Project Context for Google Gemini. IANA-registered .faf format, MCP server + Cloud Run REST API, unifies CLAUDE.md, GEMINI.md, AGENTS.md."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["faf", "mcp", "gemini", "ai-context", "model-context-protocol", "fastmcp", "claudemd", "geminimd", "agentsmd", "ai-agents", "context-management"]
dependencies = [
    "fastmcp>=4.0.0",
    "faf-python-sdk>=1.2.0",  # detect_dart_project (Dart/Flutter); SDK 1.2.0 ships BEFORE this MCP
    "functions-framework>=3.0.0",
    "google-cloud-bigquery>=3.0.0",
    "google-cloud-secret-manager>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
]

[project.scripts]
gemini-faf-mcp = "server:main"

[project.urls]
"Homepage" = "https://github.com/Wolfe-Jam/gemini-faf-mcp"
"FAF Specification" = "https://faf.one"
"IANA Registration" = "https://www.iana.org/assignments/media-types/application/vnd.faf+yaml"
"Bug Tracker" = "https://github.com/Wolfe-Jam/gemini-faf-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.20.2",
    "types-PyYAML",
    "types-requests",
    "ruff>=0.1.0",
]

[tool.setuptools]
py-modules = ["server", "models", "safe_path", "inject"]
packages = ["gemini_faf_mcp"]
package-dir = {"gemini_faf_mcp" = "src/gemini_faf_mcp"}

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
exclude = ["dist/", "build/", "gemini_faf_mcp.egg-info/", ".venv/"]

[[tool.mypy.overrides]]
module = ["functions_framework.*", "google.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# faf-python-sdk ships without a py.typed marker (upstream packaging gap, not
# a code issue here) — 6 "missing library stubs" errors as of faf_sdk 1.0.2.
# Same class as functions_framework/google above; mirrors that pattern.
module = ["faf_sdk.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["dist", "build", ".venv", "gemini_faf_mcp.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled separately; keep noise down for first pass

[[tool.mypy.overrides]]
module = "tomllib"
disable_error_code = ["import-untyped"]

